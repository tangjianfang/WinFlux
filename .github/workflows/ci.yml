name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    # windows-latest now ships Visual Studio 18; the presets pin the
    # "Visual Studio 17 2022" generator, so target the image that has it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64-debug)
        run: cmake --preset x64-debug
      - name: Build (x64-debug)
        run: cmake --build --preset x64-debug
      - name: Test (x64-debug)
        run: ctest --preset x64-debug --output-on-failure
        env:
          # The lifecycle target needs an interactive window station with a
          # D2D-capable desktop; CI runners can't guarantee one, so it opts
          # out explicitly (the always-headless smoke target still runs).
          WINFLUX_SKIP_GUI_TESTS: 1

      - name: Configure (x64-release)
        run: cmake --preset x64-release
      - name: Build (x64-release)
        run: cmake --build --preset x64-release
      - name: Test (x64-release)
        run: ctest --preset x64-release --output-on-failure
        env:
          WINFLUX_SKIP_GUI_TESTS: 1

  asan:
    # AddressSanitizer build of the headless targets (review 2026-10-06
    # 06-R11): the smoke suite runs instrumented, so heap overflows /
    # use-after-free regressions (R-1/R-2 classes) fail CI instead of
    # waiting for a crash report.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (x64-asan)
        run: cmake --preset x64-asan
      - name: Build (x64-asan)
        run: cmake --build --preset x64-asan
      - name: Test (x64-asan)
        run: ctest --preset x64-asan --output-on-failure
        env:
          WINFLUX_SKIP_GUI_TESTS: 1
